[package]
# NEVER published. This is a MODIFIED fork of `espr`: its codegen emits
# `::step_p21` paths, so it can no longer generate code for upstream `ruststep`
# and is not the crate that sits on crates.io under the old name. It is kept
# because this workspace's tests drive the `Holder`/table machinery through
# `inline_express!`, and it reaches consumers only as a path-only
# dev-dependency, which cargo strips at publish.
publish = false
name = "step-p11-derive"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

description   = "Procedural macro for running the step-p11 compiler"
documentation = "https://docs.rs/step-p11-derive"
repository.workspace = true
keywords      = ["step", "cad", "compiler", "proc-macro"]
license.workspace = true
readme        = "../README.md"
categories    = ["science", "development-tools"]

[lib]
proc-macro = true

[dependencies]
quote = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true }

step-p11 = { workspace = true }

[dev-dependencies]
step-p21 = { workspace = true }
step-p21-derive = { workspace = true }
serde = { workspace = true }
derive-new = { workspace = true }
