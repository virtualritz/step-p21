[package]
name = "espr-derive"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

description   = "Procedural macro for running the espr compiler"
documentation = "https://docs.rs/espr-derive"
repository.workspace = true
keywords      = ["step", "cad", "compiler", "proc-macro"]
license.workspace = true
readme        = "../README.md"
categories    = ["science", "development-tools"]

[lib]
proc-macro = true

[dependencies]
quote = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true }

espr = { workspace = true }

[dev-dependencies]
step-p21 = { workspace = true }
step-p21-derive = { workspace = true }
serde = { workspace = true }
derive-new = { workspace = true }
